name: CodeMender CI/CD Guardrail

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      finding_match:
        description: "Text to match against a finding's title (case-insensitive)"
        required: false
        default: "SQL Injection"

env:
  SCAN_PATH: app
  CM_DL_PROJECT: cmoc-prod
  CM_DL_LOCATION: us
  CM_DL_REPO: codemender-cli-production
  CM_DL_VERSION: stable
  CM_ASSET_ZIP: cm-linux-amd64.zip
  PER_VERIFY_TIMEOUT: "900"
  PER_FIX_TIMEOUT: "900"

permissions:
  contents: write
  pull-requests: write
  security-events: write
  id-token: write

jobs:
  codemender:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}

      - name: Resolve scan commit
        id: scan_ref
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install app dependencies
        run: pip install -r app/requirements.txt

      - name: Install Semgrep OSS
        run: pip install semgrep==1.177.0
 
      - name: Run Semgrep scan (static analysis)
        run: semgrep scan --config auto --json-output="$RUNNER_TEMP/semgrep-report.json" --sarif-output="$RUNNER_TEMP/semgrep.sarif" "$SCAN_PATH" || true
        
      - name: Publish Semgrep summary
        if: always()
        run: |
          COUNT="$(jq '.results | length' "$RUNNER_TEMP/semgrep-report.json")"
          {
            echo "# 🔎 Semgrep Static Analysis Report"
            echo ""
            echo "*Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")*"
            echo ""
            echo "## Summary"
            echo ""
            echo "**Total findings: $COUNT**"
            echo ""
            echo "| Severity | Count |"
            echo "|----------|-------|"
            jq -r '.results | group_by(.extra.severity) | map({severity: .[0].extra.severity, count: length}) | sort_by(-.count) | .[] | "| \(.severity) | \(.count) |"' "$RUNNER_TEMP/semgrep-report.json"
            echo ""
            echo "## Findings"
            echo ""
            echo "| Rule | Severity | File:Line | Message |"
            echo "|------|----------|-----------|---------|"
            jq -r '.results[] | "| `\(.check_id)` | \(.extra.severity) | `\(.path):\(.start.line)` | \(.extra.message | gsub("\\|"; "\\|") | gsub("\n"; " ") | if length > 80 then .[0:80] + "…" else . end) |"' "$RUNNER_TEMP/semgrep-report.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Semgrep JSON report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: semgrep-report
          path: ${{ runner.temp }}/semgrep-report.json
          if-no-files-found: warn

      - name: Upload Semgrep SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/semgrep.sarif
          category: semgrep
          ref: refs/heads/${{ env.TARGET_BRANCH }}
          sha: ${{ steps.scan_ref.outputs.sha }}
 
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Install CodeMender CLI (cm)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmbin"
          gcloud artifacts generic download \
            --project="$CM_DL_PROJECT" --location="$CM_DL_LOCATION" \
            --repository="$CM_DL_REPO" --package=cm --version="$CM_DL_VERSION" \
            --name="$CM_ASSET_ZIP" --destination="$RUNNER_TEMP/cmbin"
          ( cd "$RUNNER_TEMP/cmbin" && unzip -oq "$CM_ASSET_ZIP" && chmod +x cm )
          echo "$RUNNER_TEMP/cmbin" >> "$GITHUB_PATH"

      - name: Initialize CodeMender workspace (cm init)
        run: cm init -y 2>/dev/null || cm init 2>/dev/null || true

      - name: Run CodeMender scan (cm find)
        run: cm find "$SCAN_PATH" -y 2>&1 | tee "$RUNNER_TEMP/find.log"

      - name: Generate CodeMender reports (cm report)
        if: always()
        run: |
          cm report -f json > "$RUNNER_TEMP/codemender-report.json" || true
          cm report -f sarif > "$RUNNER_TEMP/codemender.sarif" || true
          cm report -f md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Clean up CodeMender SARIF
        if: always()
        run: |
          jq --slurpfile rep "$RUNNER_TEMP/codemender-report.json" '
            ($rep[0] | map({key: ((.file_path | ltrimstr($ENV.GITHUB_WORKSPACE + "/")) + ":" + (.start_line | tostring)), value: .}) | from_entries) as $idx
            | {"CRITICAL": "9.5", "HIGH": "8.0", "MEDIUM": "5.5", "LOW": "3.0"} as $score
            | .runs[0].results |= (map(
                .locations[0].physicalLocation as $loc
                | ($loc.artifactLocation.uri + ":" + ($loc.region.startLine | tostring)) as $key
                | $idx[$key] as $f
                | (if $f then $f.title else (.message.text | split("\n")[0] | sub(":[^:]*Source:.*$"; "")) end) as $title
                | (.ruleId | split(":")[0]) as $cwe
                | .ruleId = ($cwe + "/" + ($title | ascii_downcase | gsub("[^a-z0-9]+"; "-") | ltrimstr("-") | rtrimstr("-")))
                | .message.text = (if $f then $f.analysis else .message.text end)
                | .properties = {title: $title, severity: ($f.severity // "MEDIUM"), key: $key}
              ) | unique_by(.properties.key))
            | .runs[0].tool.driver.rules = ([.runs[0].results[] | {
                id: .ruleId,
                name: .properties.title,
                shortDescription: {text: .properties.title},
                helpUri: ("https://cwe.mitre.org/data/definitions/" + (.ruleId | split("/")[0] | ltrimstr("CWE-")) + ".html"),
                properties: {tags: ["security", (.ruleId | split("/")[0])], "security-severity": ($score[.properties.severity] // "5.5")}
              }] | unique_by(.id))
            | .runs[0].results |= map(del(.properties))
          ' "$RUNNER_TEMP/codemender.sarif" > "$RUNNER_TEMP/codemender.clean.sarif" \
            && mv "$RUNNER_TEMP/codemender.clean.sarif" "$RUNNER_TEMP/codemender.sarif" || true
      
      - name: Upload CodeMender JSON report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: codemender-report
          path: ${{ runner.temp }}/codemender-report.json
          if-no-files-found: warn

      - name: Upload CodeMender SARIF report
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/codemender.sarif
          category: codemender
          ref: refs/heads/${{ env.TARGET_BRANCH }}
          sha: ${{ steps.scan_ref.outputs.sha }}

      - name: Select finding to verify
        id: select
        env:
          MATCH: ${{ inputs.finding_match || 'SQL Injection' }}
        run: |
          set -uo pipefail
          LINE="$(grep -i "$MATCH" "$RUNNER_TEMP/find.log" | head -n1 || true)"
          if [ -z "$LINE" ]; then
            echo "No finding matched '$MATCH' — nothing to verify."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FID="$(echo "$LINE" | awk '{print $1}')"
          echo "Matched finding $FID: $LINE"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "finding_id=$FID" >> "$GITHUB_OUTPUT"

      - name: Verify CodeMender finding (cm verify)
        id: verify
        if: steps.select.outputs.found == 'true'
        run: |
          set -uo pipefail
          FID="${{ steps.select.outputs.finding_id }}"
          cm session list 2>/dev/null | awk '/RUNNING/{print $1}' | while read -r s; do [ -n "$s" ] && cm session cancel "$s" >/dev/null 2>&1 || true; done || true
          ( cd "$SCAN_PATH" && timeout "$PER_VERIFY_TIMEOUT" cm verify "$FID" -y --unrestricted --bypass-warning ) \
            2>&1 | tee "$RUNNER_TEMP/verify.log"
          if grep -q "DISMISSED" "$RUNNER_TEMP/verify.log"; then
            echo "dismissed=true" >> "$GITHUB_OUTPUT"
          else
            echo "dismissed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fix CodeMender finding (cm fix)
        id: fix
        if: steps.verify.outputs.dismissed == 'false'
        run: |
          set -uo pipefail
          FID="${{ steps.select.outputs.finding_id }}"
          cm session list 2>/dev/null | awk '/RUNNING/{print $1}' | while read -r s; do [ -n "$s" ] && cm session cancel "$s" >/dev/null 2>&1 || true; done || true
          ( cd "$SCAN_PATH" && timeout "$PER_FIX_TIMEOUT" cm fix "$FID" -y --unrestricted --bypass-warning ) \
            2>&1 | tee "$RUNNER_TEMP/fix.log"
          cm report "$FID" -f md > "$RUNNER_TEMP/cm-fix-report.md" || true

      - name: Open remediation PR
        id: pr
        if: steps.fix.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          FID="${{ steps.select.outputs.finding_id }}"
          git add -u
          if git diff --cached --quiet; then
            echo "No code changes — nothing to open a PR for."
            exit 0
          fi
          BRANCH="codemender/fix-${GITHUB_RUN_ID}"
          git config user.name  "codemender[bot]"
          git config user.email "codemender-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -qm "security: CodeMender fix for $FID"
          git push -u origin "$BRANCH"
          {
            echo "CodeMender verified finding \`$FID\` was exploitable, then generated and build-tested this fix."
            echo ""
            echo "Merging clears the security gate for this finding. Review the diff under **Files changed** before merging — pre-GA CodeMender should be closely supervised."
            echo ""
            echo "<details><summary>Finding details</summary>"
            echo ""
            cat "$RUNNER_TEMP/cm-fix-report.md" 2>/dev/null || true
            echo ""
            echo "</details>"
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base "$TARGET_BRANCH" --head "$BRANCH" \
            --title "security: CodeMender fix ($FID)" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Security gate
        if: always()
        run: |
          if [ "${{ steps.select.outputs.found }}" = "false" ]; then
            echo "Target finding no longer present — already resolved. ✅"
          elif [ "${{ steps.verify.outputs.dismissed }}" = "true" ]; then
            echo "Finding dismissed by verify — false positive."
          else
            echo "::error::Finding not dismissed by verify — still blocking."
            exit 1
          fi
